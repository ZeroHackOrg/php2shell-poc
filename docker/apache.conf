# ZeroHack php2shell Lab - Apache Configuration
# Purpose: Force Apache to run a single worker process.
# This is CRITICAL. The UAF occurs in the PHP process memory. 
# If Apache has multiple workers, the subsequent request might land 
# on a clean worker, and the exploit will fail.

<IfModule mpm_prefork_module>
    ServerLimit             1
    StartServers            1
    MinSpareServers         1
    MaxSpareServers         1
    MaxRequestWorkers       1
    MaxConnectionsPerChild  0
</IfModule>

# Ensure the target endpoint does not accidentally start a session
# which would reset the heap layout.
<Directory /var/www/html>
    AllowOverride None
    Require all granted
</Directory>
