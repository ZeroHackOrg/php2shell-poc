; ZeroHack php2shell Lab - PHP Configuration
; Purpose: Enable the vulnerable session upload progress feature and limit memory 
; to force the Out-Of-Memory (OOM) condition required for the UAF.

[Session]
; CRITICAL: Enable the vulnerable feature path
session.upload_progress.enabled = On
; Disable cleanup so the session data persists long enough to trigger the UAF
session.upload_progress.cleanup = Off
; Set frequency to 0 so progress updates happen constantly
session.upload_progress.freq = 0
session.upload_progress.min_freq = 0

[PHP]
; Set a very low memory limit to force PHP to OOM during the upload process.
; This triggers the error handling path where the UAF exists.
memory_limit = 8M
; Turn on display errors so we can see the crash (500/Fatal Error) when the exploit runs
display_errors = On
error_reporting = E_ALL

; Keep the environment generally weak for exploitation
allow_url_include = On
expose_php = On
